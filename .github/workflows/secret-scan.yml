name: redacted-secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-and-history:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up locked Python test runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13.9'

      - name: Verify scanner lock
        shell: pwsh
        run: |
          $lock = Get-Content tool/security/secret-scan/scanner-lock.json -Raw | ConvertFrom-Json
          foreach ($file in $lock.files) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.path).Hash.ToLowerInvariant()
            if ($actual -cne $file.sha256) { throw "Scanner lock mismatch: $($file.path)" }
          }

      - name: Run scanner black-box tests
        shell: pwsh
        run: python -m unittest tool/security/secret-scan/test_secret_scan.py -v

      - name: Scan tracked worktree and reachable history
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP 'gonow-secret-scan'
          New-Item -ItemType Directory -Force $reportRoot | Out-Null
          ./tool/security/secret-scan/Invoke-SecretScan.ps1 -Mode worktree -Repo . -Output (Join-Path $reportRoot 'worktree.json')
          ./tool/security/secret-scan/Invoke-SecretScan.ps1 -Mode history -Repo . -Registry docs/execution/evidence/phase-00/P00-003/security/revoked-history-registry.json -Output (Join-Path $reportRoot 'history.json')
          $worktree = Get-Content (Join-Path $reportRoot 'worktree.json') -Raw | ConvertFrom-Json
          $history = Get-Content (Join-Path $reportRoot 'history.json') -Raw | ConvertFrom-Json
          if ([int]$worktree.valid_secret_finding_count -ne 0) { throw 'Tracked secret finding' }
          if ([int]$history.new_history_findings -ne 0) { throw 'New history secret occurrence' }
          if ([int]$history.historical_revoked_registry_mismatch -ne 0) { throw 'Historical registry mismatch' }
          if ([int]$worktree.secret_value_output_count -ne 0 -or [int]$history.secret_value_output_count -ne 0) { throw 'Secret value output' }

      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redacted-secret-scan-reports
          path: ${{ runner.temp }}/gonow-secret-scan
          if-no-files-found: error
          retention-days: 14
