name: flutter-quality-ratchet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-and-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Check out candidate and complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up exact Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: false

      - name: Create exact BASE_SHA worktree
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'gonow-p00-007-baseline'
          git worktree add --detach $baseline 142abfc339f003ede8d85d9534336923b5610252
          "GONOW_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run baseline and candidate ratchet
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP 'gonow-flutter-quality'
          New-Item -ItemType Directory -Force $reportRoot | Out-Null
          $report = Join-Path $reportRoot 'gonow-flutter-quality.json'
          ./tool/flutter_quality_gate.ps1 -BaselineRepo $env:GONOW_BASELINE -CandidateRepo . -Output $report -FlutterPath (Get-Command flutter).Source
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not [bool]$result.ratchet.primary_assertion_passed) { throw 'Flutter ratchet failed' }
          if ([int]$result.ratchet.new_error_count -ne 0) { throw 'New analyzer error' }
          if ([int]$result.ratchet.new_test_failure_count -ne 0) { throw 'New test failure' }
          if ([int]$result.ratchet.new_skip_count -ne 0) { throw 'New skipped test' }

      - name: Validate bounded Flutter report redaction
        id: validate-flutter-report
        if: ${{ always() }}
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP 'gonow-flutter-quality'
          $scanReport = Join-Path $env:RUNNER_TEMP 'gonow-flutter-quality-secret-scan.json'
          ./tool/security/secret-scan/Invoke-SecretScan.ps1 -Mode artifact -Repo . -Artifact $reportRoot -Output $scanReport
          $scan = Get-Content -LiteralPath $scanReport -Raw | ConvertFrom-Json
          if ([int]$scan.valid_secret_finding_count -ne 0) { throw 'Flutter report secret finding' }
          if ([int]$scan.secret_value_output_count -ne 0) { throw 'Flutter report secret value output' }

      - name: Upload bounded Flutter ratchet report
        if: ${{ always() && steps.validate-flutter-report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-quality-ratchet-${{ github.run_id }}
          path: ${{ runner.temp }}/gonow-flutter-quality
          if-no-files-found: error
          retention-days: 14
