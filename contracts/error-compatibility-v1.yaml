{
  "schema_version": "error-compatibility.v1",
  "current_profile": "error-envelope.v1",
  "legacy_profile": "legacy-detail.v0",
  "unknown_profile_fallback": "legacy-detail.v0",
  "profiles": {
    "error-envelope.v1": {
      "shape": {"error": {"required": ["code", "message", "request_id"], "optional": ["retry_after_seconds"]}},
      "preserves_http_status": true
    },
    "legacy-detail.v0": {
      "shape": {"required": ["detail"]},
      "preserves_http_status": true,
      "exposes_internal_detail": false
    }
  },
  "critical_flows": [
    {"code": "auth.invalid_token", "http_status": 401, "retry_owner": "none"},
    {"code": "auth.forbidden", "http_status": 403, "retry_owner": "none"},
    {"code": "context.invalid", "http_status": 400, "retry_owner": "none"},
    {"code": "rate.limit", "http_status": 429, "retry_owner": "http-client-after-retry-after"},
    {"code": "service.unavailable", "http_status": 503, "retry_owner": "http-client"},
    {"code": "internal.error", "http_status": 500, "retry_owner": "none"}
  ],
  "compatibility_rules": {
    "delete_legacy_profile": false,
    "force_upgrade": false,
    "unknown_profile_returns_upgrade_error": false,
    "public_messages_only": true,
    "prompt_or_secret_fields": false
  }
}
