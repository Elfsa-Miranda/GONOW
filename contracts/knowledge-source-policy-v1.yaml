{
  "schema_version": "1.0",
  "contract_id": "gonow.knowledge-source-policy",
  "policy_version": "1.0.0",
  "status": "candidate_local_provisional",
  "default_decision": "deny",
  "purpose_limitation": {
    "allowed": [
      "itinerary_planning",
      "candidate_explanation",
      "travel_knowledge_retrieval"
    ],
    "prohibited": [
      "model_training",
      "advertising_profile",
      "cross_tenant_analytics",
      "unreviewed_external_export"
    ]
  },
  "tenant_boundary": {
    "scope_key": "tenant_id",
    "cross_tenant": "deny",
    "enforcement": [
      "postgres_rls",
      "sql_acl_hard_filter_before_rank_and_limit",
      "materialization_acl_and_version_recheck"
    ],
    "missing_tenant_context": "deny"
  },
  "realtime_facts": {
    "decision": "deny_rag",
    "required_path": "tool",
    "classes": [
      "business_hours_live",
      "route_live",
      "weather_current"
    ],
    "rationale": "Mutable operational facts require an authorized live Tool and must not be represented as stable knowledge."
  },
  "ingestion_boundary": {
    "network_fetch": "deny_by_default",
    "approved_fetchers_only": true,
    "content_type_allowlist": [
      "application/json",
      "application/pdf",
      "text/html",
      "text/markdown",
      "text/plain"
    ],
    "maximum_object_bytes": 26214400,
    "malware_scan_required": true,
    "authorization_before_parse": true
  },
  "source_classes": [
    {
      "id": "first_party_product_knowledge",
      "eligibility": "explicitly_approved_only",
      "owner_role": "DataGovernance",
      "license": {
        "mode": "allowlist",
        "allowed_identifiers": [
          "gonow-first-party"
        ],
        "receipt_required": true,
        "unknown_or_expired": "deny"
      },
      "allowed_purposes": [
        "candidate_explanation",
        "itinerary_planning",
        "travel_knowledge_retrieval"
      ],
      "acl": {
        "tenant_scope": "current_tenant_only",
        "default_decision": "deny",
        "sql_hard_filter": true,
        "materialization_recheck": true,
        "principal_or_group_match_required": true
      },
      "versioning": {
        "identity": "source_id+version",
        "immutable_once_ingested": true,
        "content_sha256_required": true,
        "superseded_versions_queryable_by_new_runs": false
      },
      "retention": {
        "maximum_days": 365,
        "expiry_creates_delete_request": true,
        "default_permanent_retention": false
      },
      "approval": {
        "required_roles": [
          "DataGovernance",
          "Product"
        ],
        "receipt_required": true,
        "candidate_head_bound": true
      },
      "delete_rule_id": "delete-first-party-product-knowledge"
    },
    {
      "id": "public_licensed_reference",
      "eligibility": "license_and_residency_verified",
      "owner_role": "DataGovernance",
      "license": {
        "mode": "allowlist",
        "allowed_identifiers": [
          "cc-by-4.0",
          "cc0-1.0",
          "public-domain-verified"
        ],
        "receipt_required": true,
        "unknown_or_expired": "deny"
      },
      "allowed_purposes": [
        "candidate_explanation",
        "itinerary_planning",
        "travel_knowledge_retrieval"
      ],
      "acl": {
        "tenant_scope": "current_tenant_only",
        "default_decision": "deny",
        "sql_hard_filter": true,
        "materialization_recheck": true,
        "principal_or_group_match_required": false
      },
      "versioning": {
        "identity": "source_id+version",
        "immutable_once_ingested": true,
        "content_sha256_required": true,
        "superseded_versions_queryable_by_new_runs": false
      },
      "retention": {
        "maximum_days": 180,
        "expiry_creates_delete_request": true,
        "default_permanent_retention": false
      },
      "approval": {
        "required_roles": [
          "DataGovernance"
        ],
        "receipt_required": true,
        "candidate_head_bound": true
      },
      "delete_rule_id": "delete-public-licensed-reference"
    },
    {
      "id": "tenant_private_curated",
      "eligibility": "tenant_owner_attested_and_acl_complete",
      "owner_role": "TenantDataOwner",
      "license": {
        "mode": "owner_attestation",
        "allowed_identifiers": [
          "tenant-owned",
          "tenant-authorized"
        ],
        "receipt_required": true,
        "unknown_or_expired": "deny"
      },
      "allowed_purposes": [
        "candidate_explanation",
        "itinerary_planning",
        "travel_knowledge_retrieval"
      ],
      "acl": {
        "tenant_scope": "current_tenant_only",
        "default_decision": "deny",
        "sql_hard_filter": true,
        "materialization_recheck": true,
        "principal_or_group_match_required": true
      },
      "versioning": {
        "identity": "source_id+version",
        "immutable_once_ingested": true,
        "content_sha256_required": true,
        "superseded_versions_queryable_by_new_runs": false
      },
      "retention": {
        "maximum_days": 90,
        "expiry_creates_delete_request": true,
        "default_permanent_retention": false
      },
      "approval": {
        "required_roles": [
          "TenantDataOwner"
        ],
        "receipt_required": true,
        "candidate_head_bound": true
      },
      "delete_rule_id": "delete-tenant-private-curated"
    }
  ],
  "unknown_source_behavior": "deny_and_record_reason_code",
  "production_write_count": 0
}
