name: gonow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.12.4
  flutter_markdown: ^0.7.7+1
  amap_flutter_map: ^3.0.0
  amap_flutter_location: ^3.0.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  share_plus: ^7.2.2
  app_links: ^7.0.0
  amap_flutter_base: ^3.0.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.1
  reorderable_grid_view: ^2.2.8
  syncfusion_flutter_maps: ^33.2.4
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    - assets/china.json
    - assets/world.json
    - assets/icon/icon.png
    - assets/icon/logo_transparent_animation.png

# Flutter Launcher Icons 配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5B7FE8"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

# Flutter Native Splash 配置
flutter_native_splash:
  color: "#FFFFFF"  # 纯白背景
  image: assets/icon/logo_transparent_animation.png  # 使用带动画的透明 Logo
  android_12:
    image: assets/icon/logo_transparent_animation.png
    color: "#FFFFFF"  # Android 12+ 也使用纯白背景
  ios: true
  android: true
  web: false
