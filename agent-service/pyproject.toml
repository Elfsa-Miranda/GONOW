[project]
name = "gonow-agent-service"
version = "0.1.0"
description = "GoNow server-side agent API and durable worker runtime"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.18.5",
  "cryptography==49.0.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pg8000==1.31.5",
  "pydantic==2.13.4",
  "pyjwt[crypto]==2.13.0",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
